{% extends "core/partials/base.html" %}
{% block content %}
<div class="main-content mt-5">
    <div class="card">
        <div class="card-header">
            <h4>Add Vital Signs for Appointment with {{ appointment.patient.first_name }} {{ appointment.patient.last_name }}</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="height">Height (cm)</label>
                    <input type="text" step="0.01" name="height" class="form-control" id="height">
                </div>
                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" step="0.01" name="weight" class="form-control" id="weight">
                </div>
                <div class="form-group">
                    <label for="blood_pressure">Blood Pressure (mmHg)</label>
                    <input type="text" name="blood_pressure" class="form-control" id="blood_pressure">
                </div>
                <div class="form-group">
                    <label for="temperature">Temperature (°C)</label>
                    <input type="number" step="0.1" name="temperature" class="form-control" id="temperature">
                </div>
                <div class="form-group">
                    <label for="pulse">Pulse</label>
                    <input type="text" name="pulse" class="form-control" id="pulse">
                </div>
                <div class="form-group">
                    <label for="respiratory_rate">Respiratory Rate</label>
                    <input type="text" name="respiratory_rate" class="form-control" id="respiratory_rate">
                </div>
                <div class="form-group">
                    <label for="oxygen_saturation">Oxygen Saturation (%)</label>
                    <input type="number" step="0.1" name="oxygen_saturation" class="form-control" id="oxygen_saturation">
                </div>
                <div class="card-footer text-right">
                    <button type="submit" class="btn btn-primary">Save Vital Signs</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
