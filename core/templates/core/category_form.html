{% extends "core/partials/base.html" %}

{% block content %}
<div class="main-content mt-5">
    <div class="card">
        <div class="card-header">
            <h4>{{ category.name|default:"Create Category" }}</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="category-name">Category Name</label>
                    <input type="text" class="form-control" id="category-name" name="name" value="{{ category.name|default:'' }}" required>
                </div>
                <div class="form-group">
                    <label for="category-description">Description</label>
                    <textarea class="form-control" id="category-description" name="description">{{ category.description|default:'' }}</textarea>
                </div>
                <div class="card-footer text-right">
                    <button type="submit" class="btn btn-primary">{% if category %}Update{% else %}Create{% endif %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
