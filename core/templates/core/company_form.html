{% extends "core/partials/base.html" %}

{% block content %}
<div class="main-content mt-5">
    <div class="card">
        <div class="card-header">
            <h4>{{ company.name|default:"Add New Company" }}</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="company-name">Company Name</label>
                    <input type="text" class="form-control" id="company-name" name="name" value="{{ company.name|default:'' }}" required>
                </div>
                <div class="card-footer text-right">
                    <button type="submit" class="btn btn-primary">{% if company %}Update{% else %}Create{% endif %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
