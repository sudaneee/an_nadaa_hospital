{% extends "core/partials/base.html" %}
{% block content %}
<div class="main-content mt-5">
    <div class="card">
        <div class="card-header">
            <h4>Create Diagnosis</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="name">Diagnosis Name:</label>
                    <input type="text" name="name" class="form-control" id="name" placeholder="Enter diagnosis name" required>
                </div>
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <button type="submit" class="btn btn-primary">Create Diagnosis</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
