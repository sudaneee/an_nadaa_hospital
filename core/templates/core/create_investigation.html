{% extends "core/partials/base.html" %}
{% block content %}
<div class="main-content mt-5">
    <div class="card">
        <div class="card-header">
            <h4>Create Investigation</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Unit of Measurement</label>
                    <input type="text" name="unit_of_measurement" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Reference Range</label>
                    <input type="text" name="reference_range" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Result Type</label>
                    <select name="result_type" class="form-control" required>
                        <option value="Numeric">Numeric</option>
                        <option value="Reactive/Non-Reactive">Reactive/Non-Reactive</option>
                        <option value="Positive/Negative">Positive/Negative</option>
                        <option value="Text">Text</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="number" step="any" name="price" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Create</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
