<!-- templates/family_list.html -->
{% extends "core/partials/base.html" %} <!-- or your base template -->

{% block content %}
<div class="main-content mt-5">
    <div class="card">
        <div class="card-header">
            <h4>Family Members List</h4>
        </div>
        <div class="card-body">
            <table class="table table-striped" id="table-1">
                <thead>
                    <tr>
                        <th>Name</th>
                    </tr>
                </thead>
                <tbody>
                    {% for member in patients %}
                    <tr>
                        <td>{{ member.first_name }} {{ member.last_name }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock content %}
