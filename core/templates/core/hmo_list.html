{% extends "core/partials/base.html" %}
{% block content %}
<div class="main-content mt-5">
    <div class="card">
        <div class="card-header">
            <h4>HMOs</h4>
            <a href="{% url 'hmo_create' %}" class="btn btn-primary">Add New HMO</a>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped" id="table-1">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for hmo in hmos %}
                        <tr>
                            <td>{{ hmo.name }}</td>
                            <td>
                                <a href="{% url 'hmo_update' hmo.id %}" class="btn btn-warning">Edit</a>
                                <a href="{% url 'hmo_delete' hmo.id %}" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this HMO?');">Delete</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="2">No HMOs available.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
