{% extends "core/partials/base.html" %}
{% block content %}
<div class="main-content mt-5">
    <div class="card">
        <div class="card-header">
            <h4>{% if parameter %}Update Report Parameter{% else %}Create Report Parameter{% endif %}</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="report_type">Report Type</label>
                    <select id="report_type" name="report_type" class="form-control select2">
                        {% for report_type in report_types %}
                            <option value="{{ report_type.id }}" {% if parameter and parameter.report_type.id == report_type.id %}selected{% endif %}>{{ report_type.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="name">Parameter Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{% if parameter %}{{ parameter.name }}{% endif %}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" name="description">{% if parameter %}{{ parameter.description }}{% endif %}</textarea>
                </div>
                <div class="card-footer text-right">
                    <button type="submit" class="btn btn-primary">{% if parameter %}Update{% else %}Create{% endif %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
