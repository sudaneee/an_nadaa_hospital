{% extends "core/partials/base.html" %}
{% block content %}
<div class="main-content mt-5">
    <div class="card">
        <div class="card-header">
            <h4>{% if transaction %}Update{% else %}Create{% endif %} Inventory Transaction</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="inventory_item">Inventory Item</label>
                    <select class="form-control select2" id="inventory_item" name="item" required>
                        {% for item in items %}
                            <option value="{{ item.id }}" {% if transaction and transaction.item.id == item.id %}selected{% endif %}>{{ item.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantity_changed">Quantity Changed</label>
                    <input type="number" class="form-control" id="quantity_changed" name="quantity_changed" value="{{ transaction.quantity_changed|default:'' }}" required>
                </div>
                <div class="form-group">
                    <label for="transaction_type">Transaction Type</label>
                    <select class="form-control" id="transaction_type" name="transaction_type" required>
                        <option value="Addition" {% if transaction and transaction.transaction_type == 'Addition' %}selected{% endif %}>Addition</option>
                        <option value="Removal" {% if transaction and transaction.transaction_type == 'Removal' %}selected{% endif %}>Removal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" name="description">{{ transaction.description|default:'' }}</textarea>
                </div>
                <div class="card-footer text-right">
                    <button type="submit" class="btn btn-primary">{% if transaction %}Update{% else %}Create{% endif %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
