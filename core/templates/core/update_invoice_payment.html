{% extends "core/partials/base.html" %}
{% block content %}
<div class="main-content mt-5">
    <div class="card">
        <div class="card-header">
            <h4>Update Invoice Payment</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label>Invoice ID:</label>
                    <input type="text" class="form-control" value="{{ invoice.invoice_number }}" readonly>
                </div>

                <div class="form-group">
                    <label>Patient Name:</label>
                    <input type="text" class="form-control" value="{{ invoice.patient.first_name }} {{ invoice.patient.last_name }}" readonly>
                </div>

                <div class="form-group">
                    <label>Total Amount:</label>
                    <input type="text" class="form-control" value="{{ invoice.total_amount }}" readonly>
                </div>

                <div class="form-group">
                    <label>Total Amount Paid (Before Refunds):</label>
                    <input type="text" class="form-control" value="{{ total_paid }}" readonly>
                </div>

                <div class="form-group">
                    <label>Total Refunded:</label>
                    <input type="text" class="form-control" value="{{ total_refunded }}" readonly>
                </div>

                <div class="form-group">
                    <label>Net Amount Paid (After Refunds):</label>
                    <input type="text" class="form-control" value="{{ net_paid }}" readonly>
                </div>

                <div class="form-group">
                    <label>Balance Due:</label>
                    <input type="text" class="form-control" value="{{ balance_due }}" readonly>
                </div>

                <div class="form-group">
                    <label>Payment Amount:</label>
                    <input type="text" name="amount" class="form-control">
                </div>

                <div class="form-group">
                    <label>Payment Method:</label>
                    <select name="payment_method" class="form-control" required>
                        <option value="Cash">Cash</option>
                        <option value="POS">POS</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Insurance">Insurance</option>
                        <option value="Wallet">Wallet</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" name="is_refund" value="true">
                        Is this a refund?
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">Update Payment</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
